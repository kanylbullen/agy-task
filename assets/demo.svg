<g font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,DejaVu Sans Mono,monospace" font-size="13" xml:space="preserve">
<text x="28" y="62" xml:space="preserve" style="white-space:pre"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">agy-task -r ~/src/myapp -b origin/main -w -a "node --test" -n fix-pagination \</tspan></text>
<text x="28" y="82" xml:space="preserve" style="white-space:pre"><tspan fill="#e6edf3">    -p "paginate() returns the wrong page: page 1 should be the first items. Fix the bug and run node --test to prove it."</tspan></text>
<text x="28" y="122" xml:space="preserve" style="white-space:pre"><tspan fill="#8b949e">== agy-task fix-pagination · gemini-4-hydrogen-medium (pot gemini) · </tspan><tspan fill="#e6edf3">20s</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#e6edf3">26314 tokens</tspan></text>
<text x="28" y="142" xml:space="preserve" style="white-space:pre"><tspan fill="#8b949e">directory:    </tspan><tspan fill="#e6edf3">~/worktrees/agy-fix-pagination</tspan><tspan fill="#8b949e">  (branch agy/fix-pagination)</tspan></text>
<text x="28" y="162" xml:space="preserve" style="white-space:pre"><tspan fill="#8b949e">log:          ~/.cache/agy-task/20261114-220033-fix-pagination</tspan></text>
<text x="28" y="182" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">-- git (the receipt, not the agent's word) --</tspan></text>

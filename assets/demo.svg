<text x="28" y="222" xml:space="preserve" style="white-space:pre"><tspan fill="#e6edf3"> paginate.js | 2 </tspan><tspan fill="#3fb950">+</tspan><tspan fill="#f85149">-</tspan></text>
<text x="28" y="242" xml:space="preserve" style="white-space:pre"><tspan fill="#e6edf3"> 1 file changed, 1 insertion(+), 1 deletion(-)</tspan></text>
